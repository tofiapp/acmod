[ABOUT]
NAME = LedControl
AUTHOR = tofiapp
VERSION = 0.4.2
DESCRIPTION = Takes over the steering wheel and dash LEDs of your car: colours, blinking and patterns per situation.
REQUIRED_VERSION = 2651

[CORE]
; NONE: the script runs from AC start, so the LEDs are driven even while the window is closed.
LAZY = NONE

[SIM_CALLBACKS]
; Called right before the scene is rendered: used by the direct method to put its colours back after AC's own update.
FRAME_BEGIN = frameBegin

[WINDOW_...]
ID = main
NAME = LedControl
ICON = icon.png
FUNCTION_MAIN = windowMain
FLAGS = MAIN
SIZE = 560, 660
MIN_SIZE = 380, 300
