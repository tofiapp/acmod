[ABOUT]
NAME = KeyDrive Keyboard Test
AUTHOR = tofiapp
VERSION = 0.1.0
DESCRIPTION = Test of the pure keyboard input method: with Input method = Keyboard it drives gas, brake and steering itself through ac.overrideCarControls and measures whether AC changes the values afterwards.
REQUIRED_VERSION = 2651

[CORE]
; FULL: the app runs only while its window is open; closing the window unloads it and hands the car back to AC.
LAZY = FULL

[WINDOW_...]
ID = main
NAME = KeyDrive Test klávesnice
FUNCTION_MAIN = windowMain
FLAGS = MAIN, NO_SCROLLBAR, NO_SCROLL_WITH_MOUSE, NO_COLLAPSE
SIZE = 460, 430
