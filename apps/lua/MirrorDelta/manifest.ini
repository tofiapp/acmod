[ABOUT]
NAME = MirrorDelta
AUTHOR = tofiapp
VERSION = 1.17.0
DESCRIPTION = Minimal delta bar with mini sectors for the mirror position, plus lap timing, tyres, gear, damage and notifications.
REQUIRED_VERSION = 2651

[CORE]
; NONE: the script runs from AC start, so laps are recorded even while windows are hidden.
LAZY = NONE

; Each window has its own icon in the apps taskbar and can be shown or hidden on its own.
; NO_BACKGROUND + FLOATING_TITLE_BAR: nothing but the drawing is visible, the title bar
; (for moving and the settings button) appears only on mouse hover.

[WINDOW_...]
ID = delta
NAME = MirrorDelta
ICON = icon.png
FUNCTION_MAIN = windowDelta
FUNCTION_SETTINGS = windowSettings
FLAGS = MAIN, SETTINGS, NO_BACKGROUND, FLOATING_TITLE_BAR, NO_SCROLLBAR, NO_SCROLL_WITH_MOUSE, NO_COLLAPSE
PADDING = 0, 0
SIZE = 600, 80
MIN_SIZE = 120, 16

[WINDOW_...]
ID = timing
NAME = MirrorDelta Timing
ICON = icon_timing.png
FUNCTION_MAIN = windowTiming
FUNCTION_SETTINGS = windowSettings
