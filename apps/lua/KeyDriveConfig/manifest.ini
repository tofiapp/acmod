[ABOUT]
NAME = KeyDrive Config
AUTHOR = tofiapp
VERSION = 0.2.0
DESCRIPTION = KeyDrive companion app: in-game settings (diagnostics on/off, traction intervention strength) and a recorder of AC's own keyboard handling as a reference for KeyDrive.
REQUIRED_VERSION = 2651

[CORE]
; NONE: the script runs from AC start, so the reference is recorded even while the window is hidden.
LAZY = NONE

[WINDOW_...]
ID = settings
NAME = KeyDrive
FUNCTION_MAIN = windowSettings
FLAGS = MAIN, NO_SCROLLBAR, NO_SCROLL_WITH_MOUSE, NO_COLLAPSE
SIZE = 380, 210

[WINDOW_...]
ID = reference
NAME = KeyDrive Reference
FUNCTION_MAIN = windowReference
FLAGS = NO_SCROLLBAR, NO_SCROLL_WITH_MOUSE, NO_COLLAPSE
SIZE = 420, 120
