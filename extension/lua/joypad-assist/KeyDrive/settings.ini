[KEYDRIVE]
; KeyDrive settings (throttle, brake, steering). Driving modes and per-car settings come in a later version.
THROTTLE_RISE_RATE = 120 ; Throttle rise rate in % per second; from 20 to 1000
THROTTLE_FALL_RATE = 400 ; Throttle fall rate in % per second; from 20 to 2000
MAX_THROTTLE = 100 ; Throttle cap in %; from 10 to 100
TRACTION = 1 ; Traction limiter on the driven wheels; 1 or 0
TARGET_SLIP = 100 ; Allowed slip of the driven wheels in % of the tyre's peak; from 60 to 250
TRACTION_RESPONSE = 100 ; How quickly the traction limiter reacts in %; from 30 to 300
CORNER_THROTTLE_REDUCTION = 0 ; Throttle cap reduction at full lateral load or full steering in %; from 0 to 80
BRAKE_RISE_RATE = 400 ; Brake rise rate in % per second; from 50 to 2000
BRAKE_FALL_RATE = 800 ; Brake fall rate in % per second; from 50 to 3000
MAX_BRAKE = 100 ; Brake cap in %; from 10 to 100
BRAKE_LIMITER = 1 ; Keep the wheels just below locking (works without ABS too); 1 or 0
BRAKE_TARGET_SLIP = 120 ; Allowed longitudinal wheel slip under braking in % of the tyre's peak; from 60 to 200
BRAKE_USE_GAME_ABS = 1 ; When the car's ABS is on, leave the regulation to it; 1 or 0
TRAIL_BRAKE_RELEASE = 40 ; Brake cap reduction at full steering in % (trail braking); from 0 to 90
STEER_SPEED_CURVE = 0:250 60:160 120:100 200:70 ; Steering speed: km/h:% of full lock per second pairs, separated by spaces
STEER_RETURN_SPEED = 150 ; Return to centre speed in % of the steering speed; from 50 to 400
STEER_BOTH_KEYS = 0 ; Both steering keys held: 0 keeps the angle, 1 returns smoothly to centre
STEER_LIMIT_STRENGTH = 0 ; Keep the front tyres at their peak slip angle instead of full lock in %, 0 = off; from 0 to 100
STEER_TARGET = 120 ; Front slip angle allowed by the limit in % of the tyre's peak; from 60 to 150
COUNTERSTEER_ASSIST = 0 ; Automatic countersteer when the rear slides in %, 0 = off; from 0 to 100
SHOW_DIAGNOSTICS = 1 ; Show the diagnostic overlay; 1 or 0
RECORD_LOG = 1 ; Keep the last 60 s of driving in keydrive-log.csv in the script folder (saved every 5 s); 1 or 0
